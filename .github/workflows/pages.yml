name: Publish Chinese Pages

on:
  push:
    branches: ["zh-CN"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        run: make
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate translations
        run: python scripts/i18n/validate_translation.py --root . --baseline translation/baseline.json --manifest translation/content-manifest.json --allowlist translation/allowlist.txt --report TRANSLATION_REPORT.md
      - name: Package Pages artifact
        run: python scripts/pages/package_pages.py --source html --destination dist-zh/starcraft2coop.com --base /starcraft2coop.com --report dist-zh/package-report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-zh/starcraft2coop.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
