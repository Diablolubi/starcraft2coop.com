<p class="subheading">突变因子详细信息</p>
<p>每 2 秒会部署一枚核弹（地面上会出现标记），其位置始终距离主基地至少 25，距离任意资源点至少 15。</p>
<p>核弹会部署在随机选中的玩家单位周围 50 射程内。</p>
<p>核弹会在中心 4 射程内造成 750 点基础伤害（对建筑为 950）；在 6 射程内造成基础伤害的 50%；在 8 射程内造成基础伤害的 25%。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>凯瑞甘：可以让单位进入凯瑞甘的欧米伽虫洞，避免被核弹消灭。</li>
    <li>诺娃：可以用诺娃的战术空运救走单位，避开核弹后再将其投放回原位。</li>
    <li>泰凯斯：可以用泰凯斯的医疗运输机平台救走单位，避开核弹后再将其投放回原位。</li>
</ul>
