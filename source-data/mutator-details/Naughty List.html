<p class="subheading">突变因子详细信息</p>
<p>每次击杀都会增加一层伤害叠加，使该单位受到的伤害提高一定比例。伤害增幅取决于单位的击杀数，如下表所示：</p>
<table class="dataTable centered">
    <thead>
        <tr>
            <th>击杀数</th>
            <th>每层伤害</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1-4</td>
            <td>1%</td>
        </tr>
        <tr>
            <td>5-14</td>
            <td>4%</td>
        </tr>
        <tr>
            <td>15-150</td>
            <td>6%</td>
        </tr>
    </tbody>
</table>
<p>英雄单位死亡后，直到该英雄再次完成击杀才会重新施加减益；届时会根据其整场游戏累计的击杀数施加减益。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>菲尼克斯：切换菲尼克斯形态不会重置淘气名单。</li>
    <li>菲尼克斯：菲尼克斯的智能人格英雄会保留前一个躯壳的击杀数。</li>
    <li>泽拉图：泽拉图的投影不会计入光炮/巨石的击杀数。投影会获得自己的淘气名单计数，但投影消失后该计数也会消失并重置。</li>
</ul>
