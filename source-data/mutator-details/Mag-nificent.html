<p class="subheading">突变因子详细信息</p>
<p>游戏开始时，地图各处会随机布置 200 枚磁力地雷。磁力地雷不会出现在玩家起始位置周围 30 射程内，也不会出现在资源点周围 5 射程内。</p>
<p>地雷触发后延迟 2.5 秒才会造成 250 点伤害，因此很容易躲避。无需反隐即可触发它们。</p>
<p>此外，部分地图还有以下特殊限制：</p>
<ul>
    <li>飞升之链：磁力地雷不会出现在吉娜拉周围 15 射程内。</li>
    <li>天锁：磁力地雷不会出现在天锁周围 8 射程内。</li>
</ul>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>雷诺：休伯利安号的点防御无人机可以击落磁力地雷。</li>
    <li>泽拉图：光盾卫士有 50% 概率移除磁力地雷的投射物。</li>
</ul>
