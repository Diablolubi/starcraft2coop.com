<p class="subheading">突变因子详细信息</p>
<p>第一批矿物护盾会在 2:40 出现，之后每 2:00 出现一批。每处矿物有 15% 概率被护盾覆盖；矿物护盾每出现一轮，该概率提高 5%。</p>
<p>每个矿物护盾拥有 50 点生命值，持续 60 秒。单位不会自动攻击矿物护盾，因此需要手动指定目标将其摧毁。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>汉与霍纳：两组磁力地雷可以清除一条矿线生成的全部矿物护盾。</li>
    <li>斯托科夫：让一辆研究了腐蚀黏液的响尾蛇在矿线后巡逻，即可自动清除护盾。</li>
    <li>扎加拉：在矿线后布置胆汁喷射体，让其轰炸自动清除矿物护盾。</li>
</ul>
