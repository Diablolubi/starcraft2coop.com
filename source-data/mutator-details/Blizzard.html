<p class="subheading">突变因子详细信息</p>
<p>暴风雪会在 5 秒内将单位的移动速度降低至 12%，同时对范围内的所有单位每秒造成 5 点伤害。减益效果持续 2 秒。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>阿塔尼斯：龙骑士的三棱压缩系统升级可以让它们在暴风雪中存活更久。</li>
    <li>斯托科夫：斯托科夫扎根地堡的治疗速度足以抵消暴风雪的伤害。</li>

</ul>
