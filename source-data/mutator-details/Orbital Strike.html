<p class="subheading">突变因子详细信息</p>
<p>从游戏开始起，每 1:20 会施放一次轨道轰炸。轰炸位置距离主基地至少 30，距离任意资源点至少 15。此外，如果有效目标少于 5 个，则不会施放。</p>
<p>目标数量取决于任务时间，如下表所示：</p>
<table class="dataTable">
    <thead>
        <tr>
            <th>任务时间</th>
            <th>目标数</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>0:00-5:00</td>
            <td>10</td>
        </tr>
        <tr>
            <td>5:00-8:20</td>
            <td>3</td>
        </tr>
        <tr>
            <td>8:20-11:40</td>
            <td>4</td>
        </tr>
        <tr>
            <td>11:40-16:40</td>
            <td>8</td>
        </tr>
        <tr>
            <td>16:40+</td>
            <td>10</td>
        </tr>
    </tbody>
</table>
<p>轨道轰炸会分两轮开火，每轮对每个目标发射三炮，造成 50 点伤害（对重甲为 100）。</p>
<p>任务目标虽然不会被特意选中，但会受到轨道轰炸的溅射伤害。</p>
