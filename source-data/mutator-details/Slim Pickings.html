<p class="subheading">突变因子详细信息</p>
<p>每处矿物最多含有 1500 矿物。自动采气厂、自动吸纳舱、矿骡和工人每次采集或往返都只能获得 1 点资源。</p>
<p>任务开始后的前 3 分钟，资源拾取物每 5.4 秒生成一次，之后改为每 7 秒生成。每个拾取物含有 50 矿物或 50 高能瓦斯。每次会生成两个矿物拾取物，或 1 个矿物拾取物和 1 个高能瓦斯拾取物。它们只能由地面单位拾取。</p>
<p>每隔一次生成，其中一个拾取物会出现在地图任意位置，另一个则只会在起始位置周围 30 射程内生成。该限制只在前 3 分钟生效，之后拾取物不再限定于起始位置附近。</p>
