<p class="subheading">突变因子详细信息</p>
<p>向英雄单位、顶栏技能单位和泰凯斯的歹徒下达命令，每次都要花费 10 矿物和 5 高能瓦斯。向普通单位下令的费用取决于其实际造价与补给占用。不消耗高能瓦斯的单位需支付其补给数 2 倍的矿物；消耗高能瓦斯的单位则需支付其补给数 1 倍的矿物和高能瓦斯。请注意，如果资源不足，下达命令免费；但如果高能瓦斯为零，微交易的矿物费用会翻倍。</p>
<p>只有直接向单位下达命令才会收费。因此，让单位跟随另一单位时只会收取最初设置跟随的费用；被跟随单位移动时，所有跟随者都不会再次收费。</p>
<p>如果盟友离开，向其单位下达命令也不会免费。</p>
