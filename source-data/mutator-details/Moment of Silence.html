<p class="subheading">突变因子详细信息</p>
<p>静默时刻会在死亡单位周围 8 射程内施放，持续 12 秒。</p>
<p>如果死亡单位是混合体天罚者，效果会延迟 2 秒施加；其他情况下延迟 1 秒。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>德哈卡：德哈卡的族群首领属于地图首领，因此免疫静默时刻。</li>
    <li>凯瑞甘：可以在静默时刻减益触发前进入欧米伽虫洞躲避。</li>
    <li>诺娃：可以在静默时刻减益触发前使用战术空运躲避。</li>
    <li>泰凯斯：可以在静默时刻减益触发前使用医疗运输机接送躲避。</li>
</ul>
