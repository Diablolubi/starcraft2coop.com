<p class="subheading">突变因子详细信息</p>
<p>恐惧对非英雄单位持续 10 秒，对英雄单位持续 5 秒。恐惧按概率施加，取决于单位的耐久值（生命值 + 护盾值），百分比计算公式为 2000/耐久值。因此，耐久值不高于 20 的单位有 100% 概率陷入恐惧。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>阿塔尼斯：护盾超载可以阻止单位触发恐惧。</li>
    <li>诺娃：防御无人机的防御矩阵可以阻止单位触发恐惧。</li>
    <li>斯旺：防御矩阵可以阻止单位触发恐惧。</li>
    <li>斯台特曼：艾的呵护超载可以阻止单位触发恐惧。</li>
    <li>泰凯斯：医疗运输机接送不会移除恐惧减益。</li>
</ul>
