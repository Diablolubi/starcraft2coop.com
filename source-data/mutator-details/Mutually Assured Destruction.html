<p class="subheading">突变因子详细信息</p>
<p>所有混合体死亡时都会引爆核弹。如果死亡的是混合体天罚者或“聚铁成兵”中的莫比斯混合体 A，核弹延迟 2 秒爆炸；其他情况下延迟 1 秒。</p>
<p>混合体毁灭者会引爆小型核弹，其他混合体则引爆大型核弹。核弹在半径 #1 内造成 750 点基础伤害（对建筑为 950），在半径 #2 内造成基础伤害的 50%，在半径 #3 内造成基础伤害的 25%，具体如下：</p>
