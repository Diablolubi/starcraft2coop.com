<p class="subheading">突变因子详细信息</p>
<p>刚刚死亡并被突变因子复活的单位会昏迷（无法移动、攻击或使用技能）并无敌 1 秒。</p>
<p>非建筑类任务目标和奖励目标会受到“就是死不了！”影响，因此被消灭后会重生一次。</p>
<p>请注意，单位并不是真的重新生成；它们首次受到致命伤害时，生命值、护盾和能量会直接恢复至满值。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>阿巴瑟：单位只会在最终被消灭时掉落一次生物质。</li>
    <li>德哈卡：单位只会在最终被消灭时掉落一次精华。</li>
    <li>蒙斯克：单位只会在最终被消灭时提供一次皇家卫队经验值。</li>
</ul>
