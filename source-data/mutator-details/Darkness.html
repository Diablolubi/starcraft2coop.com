<p class="subheading">突变因子详细信息</p>
<p>进攻波次和目标的信号标记不会显示在小地图上。将着色器设置降低至中等或更低画质后即可看到地形，从而抵消该突变因子的效果。</p>
<p class="subheading">指挥官专属技巧</p>
<ul>
    <li>阿巴瑟：布置剧毒巢穴并关闭自动引爆，为地图关键区域提供视野。</li>
    <li>斯台特曼：被禁用的艾星仍会提供正常视野。</li>
    <li>泽拉图：黑暗会禁用泽拉图的全地图地形视野。你可能需要使用集结点寻找神器碎片，如下所示：<br>
